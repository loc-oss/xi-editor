[package]
name = "xi-plugin-lib"
version = "0.1.0"
license = "Apache-2.0"
authors = [
    "Raph Levien <raph@google.com>",
    "LOC-OSS Community"
]
repository = "https://github.com/loc-oss/xi-editor"
description = "The library base for implementing xi-editor plugins."
edition = '2018'

[dependencies]
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
bytecount = "0.5"
rand = "0.6"
memchr = "2.0"
log = "0.4.3"

[dependencies.xi-trace]
git = "https://github.com/loc-oss/xi-trace"
branch = "main"

[dependencies.xi-rpc]
git = "https://github.com/loc-oss/xi-rpc"
branch = "main"

[dependencies.xi-core-lib]
path = "../core-lib"

[dependencies.xi-rope]
path = "../rope"
